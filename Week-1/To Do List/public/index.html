<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Productivity Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Glassmorphism styles */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Task completion animation */
        .task-title-strikethrough {
            position: relative;
            display: inline-block;
        }
        .task-title-strikethrough::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 0;
            height: 2px;
            background-color: currentColor;
            transition: width 0.3s ease-in-out;
        }
        .completed .task-title-strikethrough::after {
            width: 100%;
        }

        /* Drag and Drop animations & indicators */
        .dragging {
            opacity: 0.4;
            transform: scale(0.97);
        }

        .drop-zone-active {
            border-color: #6366f1 !important;
            background-color: rgba(99, 102, 241, 0.05) !important;
            box-shadow: inset 0 0 15px rgba(99, 102, 241, 0.15) !important;
        }

        .drag-over-card {
            border-top: 2px solid #6366f1 !important;
        }

        /* Toast Slide Animation */
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
        .toast-enter {
            animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .toast-exit {
            animation: slideOutRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-30 glass border-b border-slate-200/50 dark:border-slate-800/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white shadow-lg shadow-brand-500/30">
                    <i class="fa-solid font-bold text-lg fa-check-double"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300 bg-clip-text text-transparent">TaskFlow</h1>
                    <p class="text-[10px] uppercase font-bold tracking-widest text-brand-600 dark:text-brand-400">Workspace</p>
                </div>
            </div>

            <!-- Action Tools -->
            <div class="flex items-center space-x-2 sm:space-x-4">

                <!-- Theme Toggle Button -->
                <button id="themeToggleBtn" title="Toggle Theme" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-all focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>

            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- Metrics Dashboard Section -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Total Tasks Card -->
            <div class="glass p-5 rounded-2xl flex items-center justify-between shadow-sm border border-slate-200/80 dark:border-slate-800/80 hover:shadow-md transition-shadow">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Tasks</p>
                    <h3 id="statTotal" class="text-3xl font-extrabold mt-1 text-slate-900 dark:text-white">0</h3>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-950/50 text-brand-600 dark:text-brand-400 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-list-check"></i>
                </div>
            </div>

            <!-- Active Tasks Card -->
            <div class="glass p-5 rounded-2xl flex items-center justify-between shadow-sm border border-slate-200/80 dark:border-slate-800/80 hover:shadow-md transition-shadow">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Active</p>
                    <h3 id="statActive" class="text-3xl font-extrabold mt-1 text-amber-600 dark:text-amber-400">0</h3>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-clock"></i>
                </div>
            </div>

            <!-- Completed Tasks Card -->
            <div class="glass p-5 rounded-2xl flex items-center justify-between shadow-sm border border-slate-200/80 dark:border-slate-800/80 hover:shadow-md transition-shadow">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Completed</p>
                    <h3 id="statCompleted" class="text-3xl font-extrabold mt-1 text-emerald-600 dark:text-emerald-400">0</h3>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
            </div>

            <!-- Completion Progress Card -->
            <div class="glass p-5 rounded-2xl flex flex-col justify-between shadow-sm border border-slate-200/80 dark:border-slate-800/80 hover:shadow-md transition-shadow">
                <div class="flex items-center justify-between">
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Progress</p>
                    <span id="statPercentage" class="text-sm font-bold text-brand-600 dark:text-brand-400">0%</span>
                </div>
                <div class="mt-3">
                    <div class="w-full bg-slate-200 dark:bg-slate-800 h-3 rounded-full overflow-hidden p-0.5">
                        <div id="progressBar" class="bg-gradient-to-r from-brand-500 to-emerald-400 h-full rounded-full transition-all duration-500 ease-out w-0"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Main Workspace Layout: Form + Filter & List Dropzones -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- Left Panel: Create Task Form (4 Columns) -->
            <section class="lg:col-span-4 glass rounded-3xl p-6 shadow-sm border border-slate-200/80 dark:border-slate-800/80 sticky top-24">
                <div class="flex items-center justify-between mb-5">
                    <h2 class="text-lg font-bold flex items-center gap-2 text-slate-900 dark:text-white">
                        <i class="fa-solid fa-square-plus text-brand-500"></i>
                        <span>Create Task</span>
                    </h2>
                    <span class="text-xs font-medium text-slate-400">Quick Entry</span>
                </div>

                <form id="taskForm" class="space-y-4">
                    <!-- Title Input -->
                    <div>
                        <label for="taskTitle" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Task Title *</label>
                        <input type="text" id="taskTitle" required placeholder="What needs to be done?" class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm transition-all">
                    </div>

                    <!-- Category & Priority Row -->
                    <div class="grid grid-cols-2 gap-3">
                        <!-- Category -->
                        <div>
                            <label for="taskCategory" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Category</label>
                            <select id="taskCategory" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm transition-all">
                                <option value="Work">Work</option>
                                <option value="Personal">Personal</option>
                                <option value="Study">Study</option>
                                <option value="Fitness">Other</option>
                            </select>
                        </div>

                        <!-- Priority -->
                        <div>
                            <label for="taskPriority" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Priority</label>
                            <select id="taskPriority" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm transition-all">
                                <option value="Low">🔵 Low</option>
                                <option value="Medium" selected>🟡 Medium</option>
                                <option value="High">🔴 High</option>
                            </select>
                        </div>
                    </div>

                    <!-- Due Date Input -->
                    <div>
                        <label for="taskDueDate" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Due Date</label>
                        <input type="date" id="taskDueDate" class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm transition-all">
                    </div>

                    <!-- Description Input -->
                    <div>
                        <label for="taskDescription" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Description (Optional)</label>
                        <textarea id="taskDescription" rows="3" placeholder="Add additional details or sub-notes..." class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm transition-all resize-none"></textarea>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full py-3 px-4 rounded-xl bg-brand-600 hover:bg-brand-700 active:scale-[0.99] text-white font-bold text-sm shadow-md shadow-brand-500/20 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus"></i>
                        <span>Add Task</span>
                    </button>
                </form>
            </section>

            <!-- Right Panel: Filters, Search & Two Dashed Drop Zone Sections (8 Columns) -->
            <section class="lg:col-span-8 space-y-5">
                
                <!-- Controls: Search & Filters Header -->
                <div class="glass rounded-3xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-800/80 space-y-4">
                    
                    <!-- Search Bar & Mass Action Row -->
                    <div class="flex flex-col sm:flex-row items-center gap-3">
                        <div class="relative w-full">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <input type="text" id="searchInput" placeholder="Search tasks by title or description..." class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm transition-all">
                            <button id="clearSearchBtn" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <button id="clearCompletedBtn" class="w-full sm:w-auto px-4 py-2.5 rounded-xl border border-red-200 dark:border-red-900/50 bg-red-50 dark:bg-red-950/30 text-red-600 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-900/50 text-xs font-bold whitespace-nowrap transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-trash-can"></i>
                            <span>Clear Completed</span>
                        </button>
                    </div>

                    <!-- Status Tabs & Filter Selectors -->
                    <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 pt-2 border-t border-slate-200/60 dark:border-slate-800/60">
                        
                        <!-- Status Filter Tabs -->
                        <div class="flex items-center bg-slate-100 dark:bg-slate-900/80 p-1 rounded-xl">
                            <button data-status="all" class="status-tab flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-xs font-bold transition-all bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 shadow-sm">All</button>
                            <button data-status="active" class="status-tab flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all">Active</button>
                            <button data-status="completed" class="status-tab flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all">Completed</button>
                        </div>

                        <!-- Secondary Filters: Category & Priority -->
                        <div class="flex items-center gap-2">
                            <!-- Category Filter -->
                            <select id="filterCategory" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-brand-500">
                                <option value="all">All Categories</option>
                                <option value="Work">💼 Work</option>
                                <option value="Personal">👤 Personal</option>
                                <option value="Study">📚 Study</option>
                                <option value="Fitness">🏋️ Fitness</option>
                                <option value="Creative">🎨 Creative</option>
                                <option value="Finance">💰 Finance</option>
                            </select>

                            <!-- Priority Filter -->
                            <select id="filterPriority" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-brand-500">
                                <option value="all">All Priorities</option>
                                <option value="High">🔴 High</option>
                                <option value="Medium">🟡 Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Drag & Drop Instruction Banner -->
                <div class="glass p-3 rounded-2xl border border-dashed border-brand-300 dark:border-brand-900/60 bg-brand-50/50 dark:bg-brand-950/20 text-center text-xs text-brand-700 dark:text-brand-300 flex items-center justify-center gap-2 font-medium">
                    <i class="fa-solid fa-hand-pointer text-brand-500"></i>
                    <span>Drag and drop tasks between the two sections below to automatically update completion status!</span>
                </div>

                <!-- Dual Distinct Drop Zone Grid Sections -->
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                    
                    <!-- 1. Active Tasks Section Drop Zone -->
                    <div id="activeSectionWrapper" class="space-y-3">
                        <div class="flex items-center justify-between px-1">
                            <h3 class="text-sm font-bold flex items-center gap-2 text-amber-600 dark:text-amber-400">
                                <i class="fa-solid fa-spinner"></i>
                                <span>Active Tasks</span>
                            </h3>
                            <span id="activeCountBadge" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300">0</span>
                        </div>

                        <div id="activeDropZone" data-zone-status="active" class="drop-zone min-h-[220px] p-3 rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/20 transition-all space-y-3">
                            <!-- Active Tasks Rendered Here -->
                        </div>
                    </div>

                    <!-- 2. Completed Tasks Section Drop Zone -->
                    <div id="completedSectionWrapper" class="space-y-3">
                        <div class="flex items-center justify-between px-1">
                            <h3 class="text-sm font-bold flex items-center gap-2 text-emerald-600 dark:text-emerald-400">
                                <i class="fa-solid fa-circle-check"></i>
                                <span>Completed Tasks</span>
                            </h3>
                            <span id="completedCountBadge" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300">0</span>
                        </div>

                        <div id="completedDropZone" data-zone-status="completed" class="drop-zone min-h-[220px] p-3 rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/20 transition-all space-y-3">
                            <!-- Completed Tasks Rendered Here -->
                        </div>
                    </div>

                </div>
            </section>
        </div>
    </main>

    <!-- Modal for Editing Tasks -->
    <div id="editModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
        <div class="glass max-w-lg w-full rounded-3xl p-6 shadow-2xl border border-slate-200/80 dark:border-slate-800/80 transform scale-95 transition-transform duration-200" id="editModalCard">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-bold flex items-center gap-2 text-slate-900 dark:text-white">
                    <i class="fa-solid fa-pen-to-square text-brand-500"></i>
                    <span>Edit Task</span>
                </h3>
                <button id="closeEditModalBtn" class="p-2 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="editTaskForm" class="space-y-4">
                <input type="hidden" id="editTaskId">
                
                <div>
                    <label for="editTaskTitle" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Title</label>
                    <input type="text" id="editTaskTitle" required class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="editTaskCategory" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Category</label>
                        <select id="editTaskCategory" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                            <option value="Work">💼 Work</option>
                            <option value="Personal">👤 Personal</option>
                            <option value="Study">📚 Study</option>
                            <option value="Fitness">🏋️ Fitness</option>
                            <option value="Creative">🎨 Creative</option>
                            <option value="Finance">💰 Finance</option>
                        </select>
                    </div>

                    <div>
                        <label for="editTaskPriority" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Priority</label>
                        <select id="editTaskPriority" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                            <option value="Low">🔵 Low</option>
                            <option value="Medium">🟡 Medium</option>
                            <option value="High">🔴 High</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="editTaskDueDate" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Due Date</label>
                    <input type="date" id="editTaskDueDate" class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                </div>

                <div>
                    <label for="editTaskDescription" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Description</label>
                    <textarea id="editTaskDescription" rows="3" class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm resize-none"></textarea>
                </div>

                <div class="flex items-center justify-end gap-3 pt-3">
                    <button type="button" id="cancelEditBtn" class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-bold">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold shadow-md shadow-brand-500/20">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirmation Modal for Delete -->
    <div id="confirmModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
        <div class="glass max-w-sm w-full rounded-3xl p-6 shadow-2xl border border-slate-200/80 dark:border-slate-800/80 text-center transform scale-95 transition-transform duration-200" id="confirmModalCard">
            <div class="w-12 h-12 rounded-full bg-red-100 dark:bg-red-950/50 text-red-600 dark:text-red-400 flex items-center justify-center text-xl mx-auto mb-4">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="confirmTitle" class="text-base font-bold text-slate-900 dark:text-white mb-2">Are you sure?</h3>
            <p id="confirmMessage" class="text-xs text-slate-500 dark:text-slate-400 mb-6">This action cannot be undone.</p>
            <div class="flex items-center justify-center gap-3">
                <button id="confirmCancelBtn" class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-bold flex-1">Cancel</button>
                <button id="confirmActionBtn" class="px-4 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold shadow-md shadow-red-500/20 flex-1">Delete</button>
            </div>
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script src="/app.js"></script>
</body>
</html>
